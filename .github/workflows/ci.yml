# Continuous integration for the TinyShop repository.
# This workflow grows with the code: every ticket that adds something checkable
# adds it here (see tickets/README.md, "Continuous integration policy").
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: the workflow's GITHUB_TOKEN can only read the repository.
permissions:
  contents: read

# One run at a time per pull request: a newer push cancels the outdated run.
# Runs on master are never cancelled, so every merged commit gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection requires this check by name. Renaming the job breaks the rule.
  proto:
    name: proto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # Pinned to a full commit SHA, which can't be moved like a tag can.
        # The comment records the version for humans and for Dependabot.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the breaking-change check can read the base commit
          # from the local .git (the repository is private, so buf can't clone it anonymously).
          fetch-depth: 0
          # Don't leave the token in .git/config for later steps; nothing needs to push.
          persist-credentials: false

      - name: Check protobuf contracts (format, lint, breaking)
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          # Same buf version as the local commands in tinyshop/docs/contracts.md §9.5.
          version: 1.50.0
          input: tinyshop/proto
          format: true
          lint: true
          # Pull requests compare against their base commit, pushes against the previous commit.
          # Manual runs have nothing to compare against, so they skip this check.
          breaking: ${{ github.event_name != 'workflow_dispatch' }}
          breaking_against: .git#ref=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }},subdir=tinyshop/proto
          # Never talk to the Buf Schema Registry.
          push: false
          archive: false
          # Commenting on pull requests would need "pull-requests: write"; the check status is enough.
          pr_comment: false

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose file
        working-directory: tinyshop/infrastructure/compose
        # .env is git-ignored, so CI validates with the committed template (which also proves
        # the template lists every variable compose.yaml needs).
        # --profile '*' includes services behind profiles; without it, a broken debug-only
        # service would pass.
        run: docker compose --env-file .env.example --profile '*' config --quiet

  # One job per .NET solution: each service's, and the shared projects' (tinyshop/shared, which
  # holds the tests for the shared code). Adding a service means adding one entry to the matrix.
  # Every service's solution also builds the shared projects it references, so a change in
  # shared/ is checked against every service, not only by its own tests.
  dotnet:
    name: dotnet (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let every solution finish, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        include:
          - name: shared
            directory: tinyshop/shared
            solution: TinyShop.Shared.slnx
          - name: product-service
            directory: tinyshop/services/product-service
            solution: TinyShop.ProductService.slnx
          - name: user-service
            directory: tinyshop/services/user-service
            solution: TinyShop.UserService.slnx
          - name: payment-service
            directory: tinyshop/services/payment-service
            solution: TinyShop.PaymentService.slnx
          - name: order-service
            directory: tinyshop/services/order-service
            solution: TinyShop.OrderService.slnx
          - name: gateway
            directory: tinyshop/services/gateway
            solution: TinyShop.Gateway.slnx
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # Installs exactly the SDK that global.json pins, the same one used locally.
          # dotnet finds tinyshop/global.json by searching upward from the solution's folder.
          global-json-file: tinyshop/global.json

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build (warnings are errors)
        run: dotnet build ${{ matrix.solution }} --no-restore --configuration Release -warnaserror

      - name: Check formatting (.editorconfig)
        run: dotnet format ${{ matrix.solution }} --no-restore --verify-no-changes

      - name: Unit tests
        run: dotnet test --solution ${{ matrix.solution }} --no-build --configuration Release

  # The React app (TS-026): the same checks as "npm run" locally, from a clean install.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tinyshop/services/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The same major as locally: .nvmrc plays the part global.json plays for .NET.
          node-version-file: tinyshop/services/frontend/.nvmrc
          # Caches npm's download cache, keyed on the lock file; node_modules is always rebuilt.
          cache: npm
          cache-dependency-path: tinyshop/services/frontend/package-lock.json

      - name: Install (exactly what package-lock.json says)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Services may depend on each other only through contracts, never through project references.
  service-boundaries:
    name: service-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No project references across services
        run: bash tinyshop/infrastructure/scripts/check-service-boundaries.sh

  # Lints every shell script in the repository (init scripts, helper scripts). Shell code fails in
  # subtle ways (unquoted variables, ignored errors); ShellCheck catches most of them statically.
  shell:
    name: shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck every tracked .sh file
        # A pinned image rather than the runner's preinstalled shellcheck, so CI and local runs use
        # the same version (the same command works locally with Docker).
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          echo "Checking ${#scripts[@]} script(s):" "${scripts[@]}"
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 "${scripts[@]}"

  # Builds each containerized service's image, exactly as Compose will: from the same build
  # context, which is tinyshop/ for the .NET services (they need shared/ and proto/) and the
  # frontend's own folder for the frontend (TS-015, decision 9). The Dockerfile is always
  # services/<service>/Dockerfile. Images are only built, never pushed: there's no registry and
  # no deployment.
  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: product-service
            context: tinyshop
            migrations: true
          - service: user-service
            context: tinyshop
            migrations: true
          - service: payment-service
            context: tinyshop
            migrations: false
          - service: order-service
            context: tinyshop
            migrations: true
          - service: gateway
            context: tinyshop
            migrations: false
          - service: frontend
            context: tinyshop/services/frontend
            migrations: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: >-
          docker build
          --file tinyshop/services/${{ matrix.service }}/Dockerfile
          --tag tinyshop/${{ matrix.service }}:ci
          ${{ matrix.context }}

      # Only services that own a database have a "migrations" stage.
      - name: Build migrations image
        if: matrix.migrations
        run: >-
          docker build
          --file tinyshop/services/${{ matrix.service }}/Dockerfile
          --target migrations
          --tag tinyshop/${{ matrix.service }}-migrations:ci
          ${{ matrix.context }}

  # Starts the real stack and proves the reachability matrix (architecture.md §4) against it: every
  # cell, by name and by IP (TS-014). The networks are the system's security boundary, so a Compose
  # change that opens a route the document says is blocked must fail here, not be found later.
  network:
    name: network
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tinyshop/infrastructure/compose
    # .env is git-ignored: the committed template's passwords are fine for a stack that lives for
    # one job. Read by every docker compose command below.
    env:
      COMPOSE_ENV_FILES: .env.example
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the stack
        # --wait: return once every service is healthy and every migration job has exited 0; fail if
        # one doesn't get there within the timeout. The default stack only, no debug profile.
        run: docker compose up --build --wait --wait-timeout 300

      - name: Check the reachability matrix
        run: bash ../scripts/check-reachability-matrix.sh

      - name: Show container status and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Remove the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  # The only check the master ruleset requires. It passes only if every job above passed,
  # so adding a job (or a matrix entry) never means editing the ruleset, only "needs" below.
  ci-passed:
    name: ci-passed
    # Run even when a needed job failed or was skipped. Without this, ci-passed would itself be
    # skipped, and GitHub treats a skipped required check as passing.
    if: always()
    needs: [proto, compose, dotnet, frontend, service-boundaries, image, shell, network]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every job succeeded
        env:
          # Passed through an environment variable, never pasted into the script, so job output
          # can't inject shell commands. For a matrix job, the result covers all its entries.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
