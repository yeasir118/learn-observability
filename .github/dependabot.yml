# Dependabot opens pull requests when a dependency has a newer version.
# Ecosystems are added here as the project gains them (see tickets/README.md, CI policy).
# Every update arrives as a normal pull request, so CI checks it like any other change.
version: 2
updates:
  # Actions used in .github/workflows/. Dependabot updates the pinned SHA
  # together with its "# vX.Y.Z" comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # One pull request for all action updates instead of one per action.
      github-actions:
        patterns: ["*"]

  # NuGet packages. All versions live in tinyshop/Directory.Packages.props
  # (central package management), so one directory covers every .NET project.
  - package-ecosystem: nuget
    directory: /tinyshop
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # Packages released together are upgraded together.
      ef-core-and-npgsql:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql*", "EFCore.*"]
      aspnet-and-extensions:
        patterns: ["Microsoft.AspNetCore*", "Microsoft.Extensions*"]
      testing:
        patterns: ["xunit*", "NSubstitute", "Testcontainers*"]

  # npm packages of the React app. Versions are pinned by its package-lock.json.
  - package-ecosystem: npm
    directory: /tinyshop/services/frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # Packages released together are upgraded together.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      build-and-test:
        patterns: ["vite", "@vitejs/*", "vitest", "jsdom", "@testing-library/*"]

  # Base images in each service's Dockerfile (FROM lines).
  # Add a service's folder here when it gets a Dockerfile.
  # The frontend's two images follow release lines, so not every proposed version is one to take:
  #   node    only even (LTS) majors, and together with .nvmrc (TS-026), which CI reads.
  #   nginx   only even minors: an odd minor (1.31) is the mainline branch, not stable (TS-015,
  #           decision 1). Close such a pull request with "@dependabot ignore this minor version".
  - package-ecosystem: docker
    directories:
      - /tinyshop/services/product-service
      - /tinyshop/services/user-service
      - /tinyshop/services/payment-service
      - /tinyshop/services/order-service
      - /tinyshop/services/gateway
      - /tinyshop/services/frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  # Images used directly in compose.yaml (postgres, socat, later k6, ...). Not nginx: it's the
  # frontend's base image, so its Dockerfile entry above covers it.
  - package-ecosystem: docker-compose
    directory: /tinyshop/infrastructure/compose
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
