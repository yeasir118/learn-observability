# TinyShop: the whole system in one Compose file.
# Design: tinyshop/docs/architecture.md (containers §2, networks §3, local development §8).
# Run every command from this folder; Compose reads .env from here.
#   docker compose up -d                   default stack
#   docker compose --profile debug up -d   also starts the database proxies

# Without this, the project would be named after this folder ("compose").
name: tinyshop

# Top-level "x-" keys are ignored by Compose, which makes them a place to define values once and
# reuse them with YAML anchors (&name) and aliases (*name).
# Least privilege (architecture.md §10, "Database roles"): each migration job connects as the role
# that owns its schema, each service as a role with only the table privileges it needs (read-only,
# except order_app, which also inserts and updates). None uses the superuser.
x-product-db-migrator-connection: &product-db-migrator-connection "Host=product-db;Port=5432;Database=tinyshop_products;Username=product_migrator;Password=${PRODUCT_DB_MIGRATOR_PASSWORD:?set PRODUCT_DB_MIGRATOR_PASSWORD in .env}"
x-product-db-app-connection: &product-db-app-connection "Host=product-db;Port=5432;Database=tinyshop_products;Username=product_app;Password=${PRODUCT_DB_APP_PASSWORD:?set PRODUCT_DB_APP_PASSWORD in .env}"
x-user-db-migrator-connection: &user-db-migrator-connection "Host=user-db;Port=5432;Database=tinyshop_users;Username=user_migrator;Password=${USER_DB_MIGRATOR_PASSWORD:?set USER_DB_MIGRATOR_PASSWORD in .env}"
x-user-db-app-connection: &user-db-app-connection "Host=user-db;Port=5432;Database=tinyshop_users;Username=user_app;Password=${USER_DB_APP_PASSWORD:?set USER_DB_APP_PASSWORD in .env}"
x-order-db-migrator-connection: &order-db-migrator-connection "Host=order-db;Port=5432;Database=tinyshop_orders;Username=order_migrator;Password=${ORDER_DB_MIGRATOR_PASSWORD:?set ORDER_DB_MIGRATOR_PASSWORD in .env}"
x-order-db-app-connection: &order-db-app-connection "Host=order-db;Port=5432;Database=tinyshop_orders;Username=order_app;Password=${ORDER_DB_APP_PASSWORD:?set ORDER_DB_APP_PASSWORD in .env}"

services:
  # Service names are DNS names on the Docker networks. Hostnames may not
  # contain underscores, so names use hyphens.
  product-db:
    image: postgres:18-alpine
    environment:
      # The database name and role names are part of the design, not configuration.
      POSTGRES_DB: tinyshop_products
      # The superuser: used only to initialise the database (and by a human in an emergency).
      POSTGRES_USER: postgres
      # ":?" makes Compose stop with an error if the variable is missing from .env,
      # instead of silently starting Postgres with an empty value.
      POSTGRES_PASSWORD: ${PRODUCT_DB_ADMIN_PASSWORD:?set PRODUCT_DB_ADMIN_PASSWORD in .env}
      # Read by the init script below: creates product_migrator and product_app.
      DB_ROLE_PREFIX: product
      MIGRATOR_PASSWORD: ${PRODUCT_DB_MIGRATOR_PASSWORD:?set PRODUCT_DB_MIGRATOR_PASSWORD in .env}
      APP_PASSWORD: ${PRODUCT_DB_APP_PASSWORD:?set PRODUCT_DB_APP_PASSWORD in .env}
      # product-service only reads (contracts.md §5.1).
      APP_TABLE_PRIVILEGES: SELECT
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker,
      # so the volume mounts at /var/lib/postgresql (not .../data as in older guides).
      - product-db-data:/var/lib/postgresql
      # Scripts here run once, on an empty volume. Shared by every service database.
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - product-network
    healthcheck:
      # "$$" escapes Compose's own interpolation, so the variables are expanded
      # by the shell inside the container, from the container's environment.
      # -h 127.0.0.1 checks over TCP. While init scripts run, the image runs a temporary server
      # that only listens on a Unix socket; a socket check would report "ready" before the roles
      # exist, and the migration job would start too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Same setup as product-db above (see its comments); only the names and passwords differ.
  user-db:
    image: postgres:18-alpine
    environment:
      # The database name and role names are part of the design, not configuration.
      POSTGRES_DB: tinyshop_users
      # The superuser: used only to initialise the database (and by a human in an emergency).
      POSTGRES_USER: postgres
      # ":?" makes Compose stop with an error if the variable is missing from .env,
      # instead of silently starting Postgres with an empty value.
      POSTGRES_PASSWORD: ${USER_DB_ADMIN_PASSWORD:?set USER_DB_ADMIN_PASSWORD in .env}
      # Read by the init script below: creates user_migrator and user_app.
      DB_ROLE_PREFIX: user
      MIGRATOR_PASSWORD: ${USER_DB_MIGRATOR_PASSWORD:?set USER_DB_MIGRATOR_PASSWORD in .env}
      APP_PASSWORD: ${USER_DB_APP_PASSWORD:?set USER_DB_APP_PASSWORD in .env}
      # user-service only reads (contracts.md §5.2).
      APP_TABLE_PRIVILEGES: SELECT
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker,
      # so the volume mounts at /var/lib/postgresql (not .../data as in older guides).
      - user-db-data:/var/lib/postgresql
      # Scripts here run once, on an empty volume. Shared by every service database.
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - user-network
    healthcheck:
      # "$$" escapes Compose's own interpolation, so the variables are expanded
      # by the shell inside the container, from the container's environment.
      # -h 127.0.0.1 checks over TCP. While init scripts run, the image runs a temporary server
      # that only listens on a Unix socket; a socket check would report "ready" before the roles
      # exist, and the migration job would start too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Same setup as product-db above (see its comments), except the app role's privileges.
  order-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tinyshop_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORDER_DB_ADMIN_PASSWORD:?set ORDER_DB_ADMIN_PASSWORD in .env}
      # Read by the init script below: creates order_migrator and order_app.
      DB_ROLE_PREFIX: order
      MIGRATOR_PASSWORD: ${ORDER_DB_MIGRATOR_PASSWORD:?set ORDER_DB_MIGRATOR_PASSWORD in .env}
      APP_PASSWORD: ${ORDER_DB_APP_PASSWORD:?set ORDER_DB_APP_PASSWORD in .env}
      # The only service that writes: orders are inserted (PENDING) and updated (PAID/FAILED),
      # never deleted, so no DELETE. A bug or an injected query can't erase order history.
      # Also grants the identity sequence (USAGE, SELECT), which an INSERT needs for new IDs.
      APP_TABLE_PRIVILEGES: SELECT, INSERT, UPDATE
    volumes:
      - order-db-data:/var/lib/postgresql
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - order-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Debug-only entry point from the host to product-db (architecture.md §8).
  product-db-proxy:
    image: alpine/socat:1.8.1.1
    profiles: [debug]
    # The image's entrypoint is socat, so this is just socat's arguments:
    #   TCP-LISTEN:5432        listen on 5432 inside the container
    #   fork                   handle each connection in a child process, so several clients can connect
    #   reuseaddr              allow an immediate restart without "address already in use"
    #   TCP:product-db:5432    for each connection, open a new one to product-db over product-network
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:product-db:5432
    ports:
      # Loopback only: reachable from this machine, never from the LAN.
      # Quoted, because YAML 1.1 can read unquoted "xx:yy" numbers as base-60 integers.
      - "127.0.0.1:5433:5432"
    networks:
      - product-network
      - debug-network
    depends_on:
      product-db:
        condition: service_healthy

  # Debug-only entry point from the host to user-db, at 127.0.0.1:5434 (architecture.md §8).
  # One proxy per database, never one proxy on several database networks: that container would be
  # the one place able to reach every database, undoing the per-database isolation.
  user-db-proxy:
    image: alpine/socat:1.8.1.1
    profiles: [debug]
    # Same as product-db-proxy, forwarding to user-db instead.
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:user-db:5432
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - user-network
      - debug-network
    depends_on:
      user-db:
        condition: service_healthy

  # Debug-only entry point from the host to order-db, at 127.0.0.1:5435 (architecture.md §8).
  order-db-proxy:
    image: alpine/socat:1.8.1.1
    profiles: [debug]
    # Same as product-db-proxy, forwarding to order-db instead.
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:order-db:5432
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - order-network
      - debug-network
    depends_on:
      order-db:
        condition: service_healthy

  # One-off job: applies product-service's EF Core migrations, then exits (architecture.md §10).
  # Startup chain: product-db (healthy) -> product-db-migrate (exit 0) -> product-service.
  product-db-migrate:
    image: tinyshop/product-service-migrations:local
    build:
      # Paths resolve from this folder: ../.. is tinyshop/. "dockerfile" is relative to the context.
      context: ../..
      dockerfile: services/product-service/Dockerfile
      target: migrations
    environment:
      ConnectionStrings__ProductDb: *product-db-migrator-connection
    networks:
      - product-network
    depends_on:
      product-db:
        condition: service_healthy
    # A job, not a server: run once and stay stopped. A failure must stop the chain, not loop.
    restart: "no"

  # Same as product-db-migrate: user-db (healthy) -> user-db-migrate (exit 0) -> user-service.
  user-db-migrate:
    image: tinyshop/user-service-migrations:local
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
      target: migrations
    environment:
      ConnectionStrings__UserDb: *user-db-migrator-connection
    networks:
      - user-network
    depends_on:
      user-db:
        condition: service_healthy
    restart: "no"

  # Same as product-db-migrate: order-db (healthy) -> order-db-migrate (exit 0) -> order-service.
  order-db-migrate:
    image: tinyshop/order-service-migrations:local
    build:
      context: ../..
      dockerfile: services/order-service/Dockerfile
      target: migrations
    environment:
      ConnectionStrings__OrderDb: *order-db-migrator-connection
    networks:
      - order-network
    depends_on:
      order-db:
        condition: service_healthy
    restart: "no"

  product-service:
    image: tinyshop/product-service:local
    build:
      context: ../..
      dockerfile: services/product-service/Dockerfile
    environment:
      ConnectionStrings__ProductDb: *product-db-app-connection
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - product-network
      - backend-network
    # No "ports": both networks are internal, and only the frontend publishes a port (architecture.md §2).
    depends_on:
      product-db:
        condition: service_healthy
      # Start only after the schema is in place; a failed migration keeps the service down.
      product-db-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Runs INSIDE the container against its own port, so no Docker port forwarding is involved.
      # /health/ready (not /live): "healthy" means "can serve requests", including reaching the
      # database. BusyBox wget exits non-zero on an HTTP error status such as 503.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Grace period after start: failures here don't count against "retries", and checks run
      # every start_interval instead of every interval, so the service turns healthy quickly.
      start_period: 20s
      start_interval: 2s

  # Same setup as product-service above (see its comments): no published ports, starts after its
  # migration job, healthy only when it can reach its database.
  user-service:
    image: tinyshop/user-service:local
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    environment:
      ConnectionStrings__UserDb: *user-db-app-connection
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - user-network
      - backend-network
    depends_on:
      user-db:
        condition: service_healthy
      user-db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s

  # The order flow (architecture.md §6): calls user- and product-service over HTTP/1.1 on
  # backend-network, and payment-service over gRPC (HTTP/2) on payment-network. Same setup as
  # product-service otherwise: no published ports, starts after its migration job.
  order-service:
    image: tinyshop/order-service:local
    build:
      context: ../..
      dockerfile: services/order-service/Dockerfile
    environment:
      ConnectionStrings__OrderDb: *order-db-app-connection
      ASPNETCORE_ENVIRONMENT: Production
      # The other services' addresses (architecture.md §8 naming). Service names resolve through
      # Docker's DNS on the networks both containers share. Required: the app fails at startup
      # without them. "http://" for payment-service means HTTP/2 without TLS (h2c), the only
      # protocol its port speaks.
      Services__UserService__BaseUrl: http://user-service:8080
      Services__ProductService__BaseUrl: http://product-service:8080
      Services__PaymentService__BaseUrl: http://payment-service:8080
    networks:
      - order-network     # order-db
      - backend-network   # the gateway calls it; it calls user- and product-service
      - payment-network   # it calls payment-service; nothing else on this network can
    # Only its own database and schema. Deliberately NOT user-, product- or payment-service:
    # order-service starts and is ready without them, and answers 502/504 while one is down
    # (contracts.md §6). Waiting for them would also make one unhealthy service keep this one
    # from starting at all: the cascade that readiness avoids (contracts.md §5.4).
    # "docker compose up" starts every service anyway.
    depends_on:
      order-db:
        condition: service_healthy
      order-db-migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health/ready checks order-db only (contracts.md §5.4). The port speaks HTTP/1.1,
      # so the same wget check as product-service works.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s

  # gRPC only (tinyshop.payment.v1.PaymentService), HTTP/2 only on 8080. No database, so no
  # migration job and no dependencies to wait for.
  payment-service:
    image: tinyshop/payment-service:local
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    environment:
      # Production: gRPC reflection stays off (it describes the whole API to anyone who can
      # connect). Tools then need the .proto file, e.g. grpcurl -import-path/-proto.
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      # Its own network, NOT backend-network: only order-service shares it, so the gateway and
      # the other services can't call payments directly (architecture.md §3).
      - payment-network
    healthcheck:
      # The port refuses HTTP/1.1, so wget can't check it. grpc_health_probe (in the image) calls
      # the standard grpc.health.v1 Check over HTTP/2 and exits 0 only on SERVING.
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8080", "-connect-timeout=2s", "-rpc-timeout=2s"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s

networks:
  # Product service <-> its database only. No traffic to or from outside Docker.
  product-network:
    internal: true
  # Debug profile only: the non-internal network that lets the proxies publish ports.
  debug-network: {}
  # gateway <-> services. Internal: no traffic to or from outside Docker.
  backend-network:
    internal: true
  # User service <-> its database only.
  user-network:
    internal: true
  # order-service -> payment-service (gRPC) only.
  payment-network:
    internal: true
  # Order service <-> its database only.
  order-network:
    internal: true

volumes:
  product-db-data:
  user-db-data:
  order-db-data:
