# The frontend's server block (TS-015). Copied over the image's default one, so nginx.conf
# (non-root PID file and temp paths, mime.types) stays as the image ships it.
#
# nginx.conf includes this file INSIDE its http {} block, so the two directives below the
# comment are at http level: log_format and map aren't allowed inside server {}.

# --- http level --------------------------------------------------------------------------

# Decision 8: one line per request, with hop 2 (nginx → gateway) next to the whole request.
#   upstream_addr  the gateway's IP:port this request went to ("-" if nothing was proxied)
#   upstream_time  from connecting to the gateway until its last byte arrived
#   request_time   from the client's first byte until nginx sent its last one
# request_time minus upstream_time is nginx's own share, plus the client's network.
log_format tinyshop '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                    'upstream_addr=$upstream_addr upstream_status=$upstream_status '
                    'upstream_time=$upstream_response_time request_time=$request_time';

# "instance" for nginx's own Problem Details: the request path without the query, as the
# gateway writes it. nginx can't escape JSON in a "return" body, and a client can send a raw
# '"' or '\' in the URL. So the path is used only when it holds nothing but URL characters that
# are safe inside a JSON string; anything else gives "/api/", which is still a true answer.
map $request_uri $problem_instance {
    "~^(?<path>[A-Za-z0-9._~!&()*+,;=:@/%-]*)(\?.*)?$"  $path;
    default                                               /api/;
}

# --- The server ----------------------------------------------------------------------------

server {
    # Unprivileged: no port below 1024 (decision 1). Compose publishes 8000:8080.
    # IPv4 only: the image's IPv6 helper only edits its stock file, which this one replaces.
    # So inside the container, "localhost" (which resolves to ::1 first) isn't answered:
    # the Compose health check uses 127.0.0.1.
    listen 8080;

    # At server level, so every location below inherits it.
    root /usr/share/nginx/html;

    # To stdout (the image links access.log there), so "docker logs" shows it.
    access_log /var/log/nginx/access.log tinyshop;

    # Redirects nginx makes itself carry a relative Location ("/api/"), not an absolute URL.
    # An absolute one would contain nginx's own port 8080, not the 8000 the browser used,
    # because nginx can't know about Docker's port mapping (Phase 0).
    absolute_redirect off;

    # Everything that isn't under /assets/ or /api/: index.html, favicon.svg, and every
    # client-side route (/orders/1001, /users/123/orders).
    #
    # try_files checks for a file named after the URI, and if there isn't one, falls back to
    # /index.html. That fallback is an internal redirect: nginx matches /index.html against
    # the locations again, lands back here, finds the file and serves it with status 200.
    # So index.html always leaves through this location, whatever URL the browser asked for,
    # and gets the header below.
    #
    # No $uri/ in try_files: a directory would get a 301 to its slash-terminated URL.
    location / {
        try_files $uri /index.html;

        # The browser may store the file but must ask before every use. nginx answers that
        # question with 304 (via ETag / Last-Modified) when nothing changed: a reload costs
        # a round trip but no body, and a new deploy is seen at once (question 5).
        add_header Cache-Control "no-cache";
    }

    # Vite's build output. Every name contains a hash of its content, so a changed file gets
    # a new name and a cached copy can never be stale: cache for a year, never revalidate.
    location /assets/ {
        # No fallback here: a missing script must be a 404, not index.html with 200.
        try_files $uri =404;

        # Not "always": add_header then skips error responses, so a 404 isn't cached for a year.
        # This location has its own add_header, so it inherits none from the server level.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The public API: everything under /api/ goes to the gateway (contracts.md §4).
    # "/api" without the slash doesn't match here; nginx answers it with a 301 to "/api/"
    # (relative, see absolute_redirect), and the gateway then answers its own 404.
    location /api/ {
        # Decision 3: resolve "gateway" per request, not once at startup.
        # 127.0.0.11 is Docker's DNS server, at the same address inside every container on a
        # user-defined network. A literal name in proxy_pass would be resolved at startup:
        # nginx wouldn't start without a gateway, and would keep its old IP after the gateway is
        # recreated. A variable makes nginx resolve it at request time, through this resolver.
        # valid=10s: re-ask at most every 10 s, instead of trusting the answer's own TTL (600 s
        # from Docker's DNS). ipv6=off: edge-network has no IPv6, so don't ask for AAAA records.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://gateway:8080;

        # No URI part after the host, so the request URI is passed unchanged: /api/orders/1001?x=1
        # reaches the gateway as /api/orders/1001?x=1 (question 1).
        proxy_pass $gateway;

        # Decision 4: nginx is the first hop we control, so it REPLACES whatever the client sent.
        # $remote_addr is the address of whoever opened the TCP connection to nginx; nothing in
        # the request can change it. $proxy_add_x_forwarded_for would append to the client's own
        # value, forwarding whatever the browser claims (question 6).
        proxy_set_header X-Forwarded-For $remote_addr;
        # http here. https once TLS ends at nginx.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Not set, on purpose: Host (nginx sends $proxy_host, "gateway:8080") and Connection
        # (nginx 1.30 talks HTTP/1.1 to the gateway and doesn't forward the client's Connection
        # header: hop-by-hop, question 7).

        # Decision 5: errors nginx makes itself become Problem Details, like every other /api
        # error. 502: no connection to the gateway (DNS failed, refused, reset). 504: the gateway
        # didn't answer within proxy_read_timeout (60 s by default, contracts.md §7).
        # The gateway's own responses, errors included, pass through untouched: error_page only
        # sees them when proxy_intercept_errors is on, and it's off by default.
        error_page 502 @upstream_unreachable;
        error_page 504 @upstream_timeout;
    }

    # Named locations: reachable only through error_page, never from a URL.
    # The same code, title and detail as the gateway's own (contracts.md §2.3): from the
    # browser's point of view, "the API couldn't be reached" is the same failure wherever it
    # happens. No traceId: no .NET code ran.
    location @upstream_unreachable {
        default_type application/problem+json;
        return 502 '{"type":"https://tinyshop.example/problems/upstream_unreachable","title":"Upstream unreachable","status":502,"detail":"The service is unreachable. Try again later.","instance":"$problem_instance","code":"upstream_unreachable"}\n';
    }

    location @upstream_timeout {
        default_type application/problem+json;
        return 504 '{"type":"https://tinyshop.example/problems/upstream_timeout","title":"Upstream timeout","status":504,"detail":"The service didn\'t answer in time. Try again later.","instance":"$problem_instance","code":"upstream_timeout"}\n';
    }
}
