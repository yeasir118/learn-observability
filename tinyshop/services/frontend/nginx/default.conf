# The frontend's server block (TS-015). Copied over the image's default one, so nginx.conf
# (non-root PID file and temp paths, mime.types, the log format) stays as the image ships it.

server {
    # Unprivileged: no port below 1024 (decision 1). Compose publishes 8000:8080.
    listen 8080;

    # At server level, so every location below inherits it.
    root /usr/share/nginx/html;

    # Everything that isn't under /assets/: index.html, favicon.svg, and every client-side
    # route (/orders/1001, /users/123/orders).
    #
    # try_files checks for a file named after the URI, and if there isn't one, falls back to
    # /index.html. That fallback is an internal redirect: nginx matches /index.html against
    # the locations again, lands back here, finds the file and serves it with status 200.
    # So index.html always leaves through this location, whatever URL the browser asked for,
    # and gets the header below.
    #
    # No $uri/ in try_files: a directory would get a 301 to its slash-terminated URL, built
    # with nginx's own port 8080 (Phase 0).
    location / {
        try_files $uri /index.html;

        # The browser may store the file but must ask before every use. nginx answers that
        # question with 304 (via ETag / Last-Modified) when nothing changed: a reload costs
        # a round trip but no body, and a new deploy is seen at once (question 5).
        add_header Cache-Control "no-cache";
    }

    # Vite's build output. Every name contains a hash of its content, so a changed file gets
    # a new name and a cached copy can never be stale: cache for a year, never revalidate.
    location /assets/ {
        # No fallback here: a missing script must be a 404, not index.html with 200.
        try_files $uri =404;

        # Not "always": add_header then skips error responses, so a 404 isn't cached for a year.
        # This location has its own add_header, so it inherits none from the server level.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
